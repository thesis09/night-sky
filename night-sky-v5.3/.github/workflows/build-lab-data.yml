name: Build astrophysics lab data

# Run by hand (Actions tab -> Build astrophysics lab data -> Run workflow).
# Downloads: Gaia DR3 stars within 100 pc (HR diagram), Kepler/TESS light curves from NASA MAST,
# and SDSS spectra. Edit tools/lab_targets.json to choose light-curve and spectrum targets.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Which parts to build (comma-separated: hr, lc, spectra)"
        required: true
        default: "hr,lc,spectra"

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install "astroquery>=0.4.7" lightkurve numpy astropy
      - name: Build lab data
        env:
          STEPS: ${{ github.event.inputs.steps }}
        run: python tools/build_lab_data.py
      - name: Commit
        run: |
          git config user.name "sky-data-bot"
          git config user.email "sky-data-bot@users.noreply.github.com"
          git add data/lab
          git commit -m "Build astrophysics lab data" || echo "No changes"
          git push
      - name: Rebuild the GitHub Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
