name: Build Gaia star tiles

# Run once by hand (Actions tab -> Build Gaia star tiles -> Run workflow).
# Gaia DR3 does not change, so there is no schedule. Takes roughly 15-40 minutes.

on:
  workflow_dispatch:
    inputs:
      glim:
        description: "Faintest Gaia G magnitude to include (11 = ~1 million stars, 12 = ~3 million, 12.5 = ~5 million)"
        required: true
        default: "12.0"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install "astroquery>=0.4.7" numpy
      - name: Download Gaia DR3 and build tiles
        env:
          GLIM: ${{ github.event.inputs.glim }}
        run: |
          rm -rf data/gaia
          python tools/build_gaia_tiles.py
          du -sh data/gaia
      - name: Commit and push (retries if another workflow pushed meanwhile)
        run: |
          git config user.name "sky-data-bot"
          git config user.email "sky-data-bot@users.noreply.github.com"
          git add data/gaia
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build Gaia DR3 star tiles (G < ${{ github.event.inputs.glim }})"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $i failed; retrying in 20 s"; sleep 20
          done
          echo "Could not push after 5 attempts"; exit 1
      - name: Rebuild the GitHub Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
