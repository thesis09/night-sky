name: Update sky data

# Downloads fresh satellite orbits (CelesTrak), the confirmed-exoplanet list (NASA Exoplanet Archive),
# comet orbits (Minor Planet Center) and bright-asteroid orbits (JPL) into the data/ folder every 6 hours, so the chart
# can load them from your own site.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download satellite orbits and exoplanets
        run: |
          mkdir -p data
          get() { curl -sfL --retry 3 --max-time 120 "$2" -o "data/$1.tmp" && [ -s "data/$1.tmp" ] && mv "data/$1.tmp" "data/$1" || { echo "kept old $1"; rm -f "data/$1.tmp"; }; }
          get stations.tle "https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=tle"
          get visual.tle   "https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle"
          get starlink.tle "https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle"
          get exoplanets.csv "https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=select+pl_name,hostname,ra,dec,pl_orbper,pl_orbsmax,pl_rade,pl_bmasse,pl_eqt,disc_year,discoverymethod,pl_orbeccen+from+pscomppars&format=csv"
          # comets (Minor Planet Center) and bright asteroids, H < 11 (JPL Small-Body Database)
          get comets.txt "https://www.minorplanetcenter.net/iau/MPCORB/CometEls.txt"
          get asteroids.json "https://ssd-api.jpl.nasa.gov/sbdb_query.api?fields=full_name,epoch,e,a,q,i,om,w,ma,H,G,class&sb-kind=a&sb-cdata=%7B%22AND%22%3A%5B%22H%7CLT%7C11%22%5D%7D"
          # CelesTrak replies with a short text note instead of data if asked too often; keep the old file then
          for f in stations visual starlink; do grep -q "^1 " "data/$f.tle" 2>/dev/null || git checkout -- "data/$f.tle" 2>/dev/null || true; done
          ls -la data

      - name: Commit if anything changed
        run: |
          git config user.name "sky-data-bot"
          git config user.email "sky-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update satellite, exoplanet, comet and asteroid data"
          git push

      - name: Rebuild the GitHub Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
